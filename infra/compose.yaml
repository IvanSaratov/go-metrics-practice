name: go-metrics-practice

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: metrics
      POSTGRES_USER: metrics
      POSTGRES_PASSWORD: metrics
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

  server:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: server
    environment:
      ADDRESS: ":8080"
      DATABASE_DSN: "postgres://metrics:metrics@postgres:5432/metrics?sslmode=disable"
      FILE_STORAGE_PATH: "/data/metrics-db.json"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    ports:
      - "8080:8080"
    volumes:
      - server-data:/data

  agent:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: agent
    environment:
      ADDRESS: "http://server:8080"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres-data:
  server-data:
